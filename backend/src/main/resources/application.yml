# FitCheck backend configuration.
# Every secret/environment-specific value comes from an environment variable.
# For local dev, values are read from the repo-root .env file (copy .env.example → .env).
spring:
  application:
    name: FitCheck
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: dev
  autoconfigure:
    # Spring Boot would otherwise create a default in-memory "user" with a random password.
    # FitCheck authenticates real users from the database with JWTs, so we turn that off.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitcheck}
    username: ${POSTGRES_USER:fitcheck}
    password: ${POSTGRES_PASSWORD:fitcheck}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Outgoing email (SMTP). Defaults point at Mailpit from docker-compose.yml.
  # In production set MAIL_HOST/PORT/USERNAME/PASSWORD for your provider (e.g. Azure Communication Services).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Don't report the whole app as DOWN just because the mail server is unreachable;
    # sign-up still works and emails can be resent.
    mail:
      enabled: false

# ---- FitCheck application settings (bound via @ConfigurationProperties in com.fitcheck.config) ----
fitcheck:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    # Base64-encoded HMAC key, at least 256 bits. Generate one per environment.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    refresh-cookie-name: fitcheck_refresh
    refresh-cookie-path: /api/auth
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

  mail:
    from: ${MAIL_FROM:FitCheck <no-reply@fitcheck.local>}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    verification-ttl: 24h
    resend-cooldown: 60s

  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER:clothing-images}
    sas-ttl: 15m

  ai:
    # Blank = AI stylist switched off (the rest of the app works normally).
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    max-tokens: 16000
    # Opus 5.5's default is medium too, but we say it explicitly so changing models can't silently change cost.
    effort: medium
    daily-limit: 20
