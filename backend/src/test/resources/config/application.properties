# Test-only settings. Spring Boot reads classpath:/config/application.properties in ADDITION to
# application.yml (and lets it win), so these override the normal settings only when tests run.

# Don't start the background thumbnail job during tests; tests call it directly when they need it.
fitcheck.thumbnails.backfill-on-startup=false

# Tests register and log in hundreds of times from the same "IP"; rate limits would block them.
# RateLimitTest switches limits back on for itself.
fitcheck.rate-limit.enabled=false
