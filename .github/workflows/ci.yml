# Continuous integration: on every push to main and every pull request, GitHub starts fresh
# Linux machines, builds FitCheck and runs all its checks. A red ✗ next to a commit means
# something broke; a green ✓ means everything passed.
# On pushes to main only, and only when all checks pass, it then publishes the Docker image and
# deploys it to https://fitcheckwardrobe.com (pull requests are only checked, never deployed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again while a run is still going, cancel the old run: only the newest matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # this workflow only needs to read the code

jobs:
  backend:
    name: Backend (Java tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway databases/servers for this run only, like our docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitcheck
          POSTGRES_USER: fitcheck
          POSTGRES_PASSWORD: fitcheck
        ports: ["5432:5432"]
        # Wait until Postgres is really ready before the tests start.
        options: >-
          --health-cmd "pg_isready -U fitcheck -d fitcheck"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven # reuse downloaded libraries between runs: much faster

      - name: Set up Node (to run Azurite)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Same Azurite version and flags as docker-compose.yml, started in the background.
      - name: Start Azurite (local Azure Blob Storage)
        run: |
          npx -y azurite@3.37.0 azurite-blob --blobHost 127.0.0.1 --blobPort 10000 \
            --location "$RUNNER_TEMP/azurite" --loose --skipApiVersionCheck > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1?comp=list" && echo "Azurite is up" && exit 0
            sleep 2
          done
          echo "Azurite did not start"; cat "$RUNNER_TEMP/azurite.log"; exit 1

      # Uses the dev profile's built-in fallbacks (local Postgres, Azurite key, dev JWT key).
      # No ANTHROPIC_API_KEY: the tests use a fake Claude and live tests are skipped.
      - name: Run all backend tests
        working-directory: backend
        run: ./mvnw -B test

      # If something failed, keep the detailed test reports so you can download and read them.
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" installs exactly what package-lock.json says: the same versions you tested with.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Builds the same image Azure runs, to catch a broken Dockerfile early.
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Buildx = Docker's newer builder. Its cache (type=gha, stored by GitHub) lets the publish
      # job below reuse these layers instead of building everything a second time.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: fitcheck:ci
          load: true # keep it in this machine's Docker so the next step can run it
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it with no settings at all: prod mode must refuse to run without its secrets
      # (fail fast) rather than start up half-configured.
      - name: Check prod mode refuses to start without secrets
        run: |
          set +e
          timeout 90 docker run --rm fitcheck:ci > run.log 2>&1
          code=$?
          set -e
          tail -n 5 run.log
          # 0 = it exited "successfully", 124 = still running after 90 s: both mean it didn't refuse.
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Expected the app to stop with an error, got exit code $code"; exit 1
          fi
          echo "Refused to start as expected (exit code $code)"

  publish:
    name: Publish image to GitHub Container Registry
    # Only for pushes to main (not pull requests), and only if every check above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # allows pushing to ghcr.io/<owner>/fitcheck with the built-in GITHUB_TOKEN

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is a temporary password GitHub creates for this run only; nothing to store.
      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two names for the same image:
      #   :<commit id>  never changes, so Azure always knows exactly which code it runs
      #   :latest       moves to the newest build, handy for trying it locally
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitcheck:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fitcheck:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        run: echo "Published ghcr.io/${{ github.repository_owner }}/fitcheck:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to fitcheckwardrobe.com
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The "production" environment shows each deploy on the repo's page. Azure only trusts
    # sign-ins from jobs that use exactly this environment (see infra/setup-github-deploy.ps1).
    environment:
      name: production
      url: https://fitcheckwardrobe.com
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for a sign-in token for Azure (OIDC)
    # Never run two deploys at once; a newer one waits for the current one to finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # IDs, not secrets: they say WHO to sign in as. Azure only accepts the sign-in because the
      # GitHub token proves it comes from this repo's production deploy (no password involved).
      AZURE_CLIENT_ID: 8458c795-011b-4243-8ebc-e9fdb8d8537c
      AZURE_TENANT_ID: efcab0e4-b643-4621-b547-f68ceaad3e81
      AZURE_SUBSCRIPTION_ID: 2679f43e-9511-433d-b77f-d1cb68043ffb
      IMAGE: ghcr.io/${{ github.repository_owner }}/fitcheck:${{ github.sha }}

    steps:
      - name: Sign in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Only the image changes; settings and secrets stay as infra/deploy-app.ps1 set them.
      # Azure starts the new version, waits for its health checks, then switches traffic to it,
      # so a version that can't start never replaces the working one.
      - name: Update the app to this commit's image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g rg-fitcheck -n fitcheck --image "$IMAGE" --only-show-errors -o none

      - name: Check the new version is serving
        run: |
          for i in $(seq 1 30); do
            STATE=$(az containerapp show -g rg-fitcheck -n fitcheck --only-show-errors \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[0].image]" -o tsv | tr '\n' ' ')
            set -- $STATE
            if [ "$1" = "$2" ] && [ "$3" = "$IMAGE" ] && \
               curl -sf -m 20 https://fitcheckwardrobe.com/actuator/health/readiness > /dev/null; then
              echo "Live: $IMAGE (revision $1)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "Waiting for revision $1 to be ready ($i/30)..."; sleep 10
          done
          echo "The new version did not become ready. Logs: az containerapp logs show -g rg-fitcheck -n fitcheck --tail 50"
          exit 1
